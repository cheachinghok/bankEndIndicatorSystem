[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Default start command — this is what the "api" service runs.
# The "workers" service should override this to: python -m app.workers.main
startCommand = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
