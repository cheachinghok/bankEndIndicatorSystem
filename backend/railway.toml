[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# NOTE: startCommand and healthcheckPath are intentionally NOT set here.
# Each service defines its own via the Railway UI (Settings → Deploy) so
# the workers service can override the API service's defaults.
#
# API service (Custom Start Command):
#   sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
#   Healthcheck Path: /healthz
#
# Workers service (Custom Start Command):
#   python -m app.workers.main
#   Healthcheck Path: (leave empty — workers don't serve HTTP)

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
